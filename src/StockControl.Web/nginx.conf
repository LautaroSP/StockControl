# Rastreadores de vista previa: reciben el HTML con Open Graph de la API en vez del SPA.
map $http_user_agent $es_rastreador {
    default 0;
    ~*(WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|LinkedInBot) 1;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://images.openfoodfacts.org https://images.openfoodfacts.net; font-src 'self'; connect-src 'self' https://challenges.cloudflare.com https://*.googleapis.com https://*.push.services.mozilla.com https://*.windows.com https://web.push.apple.com; frame-src https://challenges.cloudflare.com; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Los rastreadores van a /api/… (proxy); el resto al SPA.
    location ~ ^/tienda/([a-z0-9-]+)/?$ {
        if ($es_rastreador) {
            rewrite ^/tienda/([a-z0-9-]+)/?$ /api/compartir/tienda/$1 last;
        }
        try_files /index.html =404;
    }

    location = /sitemap.xml {
        proxy_pass http://api:8080/sitemap.xml;
        proxy_set_header Host $host;
    }

    location = /robots.txt {
        proxy_pass http://api:8080/robots.txt;
        proxy_set_header Host $host;
    }

    # El HTML y la versión no se cachean (expires, sin add_header: no pisa el CSP del server).
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /version.json {
        expires -1;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg|png|jpe?g|gif|webp|ico|woff2?|map|txt|xml|webmanifest)$ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
